[project]
name = "mcpsevrerdemousinglangchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deployer", email = "deployer@railway.local" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.30.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
mcpsevrerdemousinglangchain = "mcpsevrerdemousinglangchain:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
link-mode = "copy"
